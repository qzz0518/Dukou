<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dukou 版本历史</title>
    <meta name="description" content="Dukou 的版本更新记录。">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)">
    <link rel="canonical" href="https://qzz0518.github.io/Dukou/updates.html">
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --ink: #151517;
        --text: #343438;
        --muted: #717178;
        --line: #dedee3;
        --soft: #f1f1f3;
        --accent: #16865f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #101113;
          --ink: #f4f4f5;
          --text: #d7d7db;
          --muted: #9898a1;
          --line: #333338;
          --soft: #232327;
          --accent: #58d8a8;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font: 16px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      a:hover { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

      header,
      main,
      footer {
        width: min(720px, calc(100% - 44px));
        margin-inline: auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-block: 24px;
      }

      .brand {
        color: var(--ink);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      .back { color: var(--muted); font-size: 14px; }

      main { padding-block: 48px 72px; }

      h1,
      h2,
      h3 { color: var(--ink); }

      h1 {
        margin: 0;
        font-size: clamp(42px, 9vw, 64px);
        line-height: 1.05;
        letter-spacing: -0.055em;
      }

      .intro {
        margin: 18px 0 56px;
        color: var(--muted);
        font-size: 18px;
      }

      .release {
        padding-block: 38px 42px;
        border-top: 1px solid var(--line);
      }

      .release-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px 14px;
      }

      .release h2 {
        margin: 0;
        font-size: 29px;
        line-height: 1.2;
        letter-spacing: -0.035em;
      }

      .current {
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--background);
        font-size: 12px;
        font-weight: 700;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin: 8px 0 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .notes > :first-child { margin-top: 0; }
      .notes > :last-child { margin-bottom: 0; }
      .notes p { margin: 0 0 15px; }

      .notes h3 {
        margin: 26px 0 10px;
        font-size: 19px;
        letter-spacing: -0.02em;
      }

      .notes ul,
      .notes ol {
        margin: 0;
        padding-left: 1.35em;
      }

      .notes li { margin: 8px 0; padding-left: 0.2em; }

      code {
        padding: 1px 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--soft);
        font: 0.86em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;
      }

      .load-error { color: var(--muted); }

      footer {
        padding-block: 22px 42px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 520px) {
        main { padding-top: 34px; }
        .intro { margin-bottom: 42px; }
        .release { padding-block: 30px 34px; }
        .release h2 { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="./">Dukou</a>
      <a class="back" href="./">返回首页</a>
    </header>

    <main>
      <h1>版本历史</h1>
      <p class="intro">Dukou 每个版本的主要变化。</p>
      <div id="releases">正在载入更新记录…</div>
      <noscript><p>请前往 <a href="https://github.com/qzz0518/Dukou/releases">GitHub Releases</a> 查看更新记录。</p></noscript>
    </main>

    <footer>
      <a href="https://github.com/qzz0518/Dukou/releases">Dukou Releases on GitHub</a>
    </footer>

    <script>
      const releases = [
        { version: '0.1.13', date: '2026-09-21', current: true },
        { version: '0.1.12', date: '2026-09-16' },
        { version: '0.1.11', date: '2026-09-09' },
        { version: '0.1.10', date: '2026-09-09' },
        { version: '0.1.9', date: '2026-09-08' },
        { version: '0.1.8', date: '2026-09-07' },
        { version: '0.1.7', date: '2026-09-07' },
        { version: '0.1.6', date: '2026-09-07' },
        { version: '0.1.5', date: '2026-09-07' },
        { version: '0.1.4', date: '2026-09-07' },
        { version: '0.1.3', date: '2026-09-07' },
        { version: '0.1.2', date: '2026-09-07' },
        { version: '0.1.1', date: '2026-09-06' },
        { version: '0.1.0', date: '2026-09-06' }
      ];

      const escapeHTML = (value) => value.replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);

      const inlineMarkdown = (value) => escapeHTML(value)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>');

      const chineseNotes = (source) => {
        const clean = source.replace(/<!-- sparkle-sign-warning:[\s\S]*?-->/, '').trim();
        const match = clean.match(/## 更新日志\s*([\s\S]*?)(?=\n## Changelog|$)/);
        return match ? match[1].trim() : clean;
      };

      const renderMarkdown = (source) => {
        const lines = chineseNotes(source).split(/\r?\n/);
        let html = '';
        let list = '';

        const closeList = () => {
          if (list) html += `</${list}>`;
          list = '';
        };

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) { closeList(); continue; }

          const heading = line.match(/^#{1,6}\s+(.+)$/);
          if (heading) {
            closeList();
            html += `<h3>${inlineMarkdown(heading[1])}</h3>`;
            continue;
          }

          const ordered = line.match(/^\d+\.\s+(.+)$/);
          const unordered = line.match(/^[-*]\s+(.+)$/);
          const item = ordered || unordered;
          if (item) {
            const nextList = ordered ? 'ol' : 'ul';
            if (list !== nextList) { closeList(); list = nextList; html += `<${list}>`; }
            html += `<li>${inlineMarkdown(item[1])}</li>`;
            continue;
          }

          closeList();
          html += `<p>${inlineMarkdown(line)}</p>`;
        }

        closeList();
        return html;
      };

      const dateLabel = (value) => {
        const [year, month, day] = value.split('-').map(Number);
        return `${year}年${month}月${day}日`;
      };

      Promise.all(releases.map(async (release) => {
        const file = `Dukou-${release.version}.md`;
        try {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const notes = renderMarkdown(await response.text());
          return `
            <article class="release">
              <div class="release-heading">
                <h2>Version ${release.version}</h2>
                ${release.current ? '<span class="current">当前版本</span>' : ''}
              </div>
              <div class="meta"><time datetime="${release.date}">${dateLabel(release.date)}</time></div>
              <div class="notes">${notes}</div>
            </article>`;
        } catch (_) {
          return `
            <article class="release">
              <div class="release-heading"><h2>Version ${release.version}</h2></div>
              <div class="meta"><time datetime="${release.date}">${dateLabel(release.date)}</time></div>
              <p class="load-error">此版本说明暂时无法载入。</p>
            </article>`;
        }
      })).then((articles) => {
        document.querySelector('#releases').innerHTML = articles.join('');
      });
    </script>
  </body>
</html>
